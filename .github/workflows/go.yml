name: Go checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Unit and integration tests
        run: go test ./...
      - name: Race detection
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
